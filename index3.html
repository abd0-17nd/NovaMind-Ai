<!DOCTYPE html>
<html>
    <head>
        <title>Add programming language</title>
        <link rel="stylesheet" href="style3.css">
    </head>

    <body>
        <div class="app">
            <h1 id="programming">What's your programming language ?</h1>

            <input type="text" id="languageInput" placeholder="Enter your programming language which you learn">

            <button type="button" id="addBtn">Add programming language</button>

            <p id="message"></p>

            <p>Total programming language: <span id="languageCount">0</span></p>

            <ul id="LanguageList"></ul>
        </div>
        <script src="script.js"></script>
    </body>
</html>
